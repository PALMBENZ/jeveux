<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire CV</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }
        .container {
            background: white;
            padding: 20px;
            max-width: 600px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 15px;
        }
        input[type="file"] {
            flex: 1;
            padding: 10px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        button {
            padding: 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }
        .audit {
            background-color: #28a745;
            color: white;
        }
        .premium {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Vérifie que ton CV contient bien ton prénom, ton email et ton numéro de téléphone</h2>

    <form action="#" method="post" enctype="multipart/form-data">
        
                  <div class="buttons">
                <button type="button" class="audit" name="action" value="audit" data-tally-open="5BqLAQ" data-tally-emoji-text="👋" data-tally-emoji-animation="wave">
                    Demander un audit gratuit de ton CV par nos experts en recrutement
                </button>

                <button type="submit" class="premium" name="action" value="premium">
                    Pas le temps de rechercher un emploi? Nous recherchons à ta place - 99€
                </button>
            </div>

    </form>
</div>

</body>
</html>
